

<!DOCTYPE html>
<html lang="en">
<html>
    <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Solar system</title>
        <style>
        body {
                margin: 0;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: #000;
                overflow: hidden;
        }
        .container {
                font-size: 16px;
                width: 40em;
                height: 40em;
                position: relative;
        }
        .sun {
                position: absolute;
                width: 15em;
                height: 15em;
                top: 12.5em;
                left: 12.5em;
                background-color: #ffcc00;
                border-radius: 50%;
                box-shadow: 0 0 3em white;
        }
        .earth,
        .moon {
                position: absolute;
                border-style: solid;
                border-color: white transparent transparent transparent;
                border-color: white #755050 #ffcc00 #245;
                border-width: 0.1em 0.1em 0 0;
                border-width: 0.1em 0.1em 0.1em 0.1em;
                border-radius: 50%;
        }
        .earth {
                top: 5em;
                left: 5em;
                width: 30em;
                height: 30em;
                animation: orbit 36.5s linear infinite;
        }
        .moon {
                top: 0;
                right: 0;
                width: 8em;
                height: 8em;
                animation: orbit 2.7s linear infinite;
                animation: orbit2 2.7s linear infinite;
        }
        .earth::after, .moon::after {
            content: '';    
            position: absolute;
            border-radius: 50%;
        }
        .earth::after {
                top: 2.8em;
                right: 2.8em;
                width: 3em;
                height: 3em;
                background-color: #72cdfa;
        }
        /* .moon::after {
                top: 0.8em;
                right: 0.2em;
                width: 1.2em;
                height: 1.2em;
                background-color: #ccc;
        } */
        @keyframes orbit {
                to {
                    transform: rotateX(360deg);
                    transform: rotateY(360deg);
                    transform: rotateX(360deg);
            }
        }
        @keyframes orbit2 {
                to {
                    transform: rotateY(360deg);
                    transform: rotateY(360deg);
                    transform: rotateX(360deg);
            }
        }
        h1{
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
    <div class="container">
        <div class="sun"></div>
        <div class="earth">
            <div class="moon"></div>
        </div>
    </div>
    <br><br><br>
    <h1 style="color: white;">SOLAR SYSTEM</h1>
</header>
</body>
</html>
